[package]
name = "nav_route"
version = "0.1.0"
edition = "2021"
description = "HTTP routing and geocoding service implementations for nav_core ports"

[features]
default = ["osrm", "nominatim", "navdsp"]
osrm = ["dep:reqwest"]
nominatim = ["dep:reqwest", "dep:urlencoding"]
google_routes = ["dep:reqwest"]
valhalla = ["dep:reqwest"]
navdsp = [
    "dep:reqwest",
    "reqwest/stream",
    "dep:urlencoding",
    "dep:tracing",
    "dep:tokio",
    "dep:futures-util",
    "dep:serde",
]
multi = []

[dependencies]
nav_core = { path = "../nav_core" }
nav_ir = { path = "../nav_ir" }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls"], optional = true }
urlencoding = { version = "2", optional = true }
tracing = { version = "0.1", optional = true }
tokio = { version = "1", features = ["fs", "io-util"], optional = true }
futures-util = { version = "0.3", optional = true }
